name: Wire-bytes probe

# How many GZIPPED bytes does one leaf cost on the wire? That is the unit a metered
# residential proxy bills in, and it decides whether a 100 GB purchase covers the
# remaining 6,183,851 requests or only a slice of them.
#
# The measurement lives in bin/wire_bytes.py (with a --selftest) rather than inline
# shell: the first attempt at this was a heredoc-inside-heredoc-inside-YAML and the
# URL list landed at column 0, producing invalid YAML that still got pushed.

on:
  workflow_dispatch:

jobs:
  bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python bin/wire_bytes.py --urls plan/wire_sample.txt
